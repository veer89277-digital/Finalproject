{% extends 'base.html' %}
{% load static %}
{% block content %}

<!--start gallery-->

            <p class="fs-3 text-center"> Image<b class="text-mycolor1"> Gallery</b></p><hr class="w-25 mx-auto">
            <!-- <hr class="w-25 mx-auto"> -->
            <div class="col-sm-10 mx-auto">
               <div class="row">
                  {% for r in gdata %}
               <!-- start card gallery -->
                <div class="col-sm-4">
                <div class="card p-2 shadow-lg my-2">
                  <img src="../{{r.picture}}" class="card-img-top">
                  <div class="card-title py-3 text-center fw-bold"> {{ r.title }} </div>
                </div>
                </div>
               <!-- end card gallery -->
                {% endfor %}
                </div>
            </div>
        </div>
        <!--end gallery-->



{% endblock %}
