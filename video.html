{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row">
<p class="fs-3 text-center mt-5">Video 
  <b class="text-mycolor1">Lecture </b></p>
   <hr class="w-25 mx-auto">
   <div class="col-sm-10 mx-auto">
    <div class="row">
        {% for row in data %}
        <!-- start card -->
        <div class="col-sm-3">
            <div class="card shadow-lg my-3">
                <img src="../{{row.cpic}}" class="card-img-top"/>
                <p class="card-title text-center py-3"><b>{{row.category}}</b></p>
                   
            </div>
        </div>
        <!--end card -->
        {% endfor %}
    </div>
   </div>


</div>

{% endblock %}
